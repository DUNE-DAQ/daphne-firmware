name: Formal

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: read

jobs:
  logic-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-04-08'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install FuseSoC
        run: python3 -m pip install --user 'fusesoc==2.4.3'

      - name: Check generated source manifests
        run: |
          ./scripts/fusesoc/refresh_cores.sh
          git diff --exit-code -- daphne-ip.core daphne-ip-export.core

      - name: Check scripts and documentation
        run: |
          bash -n scripts/fusesoc/check_build_outputs.sh
          sh -n petalinux/meta-daphne/recipes-core/daphne-services/files/daphne-fw-stop.sh
          python3 -m py_compile petalinux/meta-daphne/recipes-core/daphne-services/files/daphne-gateware
          python3 -m unittest discover -s tests/petalinux -v
          python3 scripts/check_documentation.py
          python3 scripts/check_register_map.py

      - name: Run GHDL smoke suite
        run: ./scripts/fusesoc/run_logic_test.sh --suite all-local

  default-formal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - default
          - cover-fast
          - boundary-cover
          - composable
          - composable-cover

    steps:
      - uses: actions/checkout@v5

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-04-08'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run formal suite
        run: ./scripts/formal/run_formal.sh --suite "${{ matrix.suite }}"

      - name: Upload cover traces
        if: always() && (matrix.suite == 'cover-fast' || matrix.suite == 'boundary-cover' || matrix.suite == 'composable-cover')
        uses: actions/upload-artifact@v4
        with:
          name: formal-cover-traces-${{ matrix.suite }}
          path: |
            formal/sby/fe_axi_axi_lite_cover/engine_0/trace*.vcd
            formal/sby/thresholds_axi_lite_cover/engine_0/trace*.vcd
            formal/sby/frontend_boundary_gate_cover/engine_0/trace*.vcd
            formal/sby/trigger_pipeline_boundary_gate_cover/engine_0/trace*.vcd
            formal/sby/spy_buffer_boundary_gate_cover/engine_0/trace*.vcd
            formal/sby/daphne_composable_frontend_shell_cover/engine_0/trace*.vcd
            formal/sby/daphne_composable_top_cover/engine_0/trace*.vcd
            formal/sby/daphne_composable_top_hermes_cover/engine_0/trace*.vcd
            formal/sby/daphne_composable_top_timing_cover/engine_0/trace*.vcd
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed formal logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-failure-logs-${{ matrix.suite }}
          path: |
            formal/sby/**/logfile.txt
            formal/sby/**/engine_0/trace*.vcd
            formal/sby/**/model/design*.log
          if-no-files-found: warn
          retention-days: 14

  all-local-formal:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-04-08'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run all local formal jobs
        run: ./scripts/formal/run_formal.sh --suite all-local

      - name: Upload failed all-local logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-failure-logs-all-local
          path: |
            formal/sby/**/logfile.txt
            formal/sby/**/engine_0/trace*.vcd
            formal/sby/**/model/design*.log
          if-no-files-found: warn
          retention-days: 14
